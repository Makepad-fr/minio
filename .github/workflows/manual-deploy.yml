name: Manual Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment target
        required: true
        type: choice
        options:
          - canary
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure SSH key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"
          printf '%s\n' "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > "${HOME}/.ssh/id_ed25519"
          chmod 600 "${HOME}/.ssh/id_ed25519"

      - name: Prepare deployment bundle
        shell: bash
        env:
          DEPLOY_CATWLK_OBJECTS_NETWORK: ${{ secrets.DEPLOY_CATWLK_OBJECTS_NETWORK }}
          DEPLOY_MINIO_ROOT_PASSWORD: ${{ secrets.DEPLOY_MINIO_ROOT_PASSWORD }}
          DEPLOY_VIF_OBJECTS_NETWORK: ${{ secrets.DEPLOY_VIF_OBJECTS_NETWORK }}
          DEPLOY_FASHION_OBJECTS_NETWORK: ${{ secrets.DEPLOY_FASHION_OBJECTS_NETWORK }}
        run: |
          set -euo pipefail
          : "${DEPLOY_CATWLK_OBJECTS_NETWORK:?set DEPLOY_CATWLK_OBJECTS_NETWORK environment secret}"
          : "${DEPLOY_MINIO_ROOT_PASSWORD:?set DEPLOY_MINIO_ROOT_PASSWORD environment secret}"
          deploy_env="${{ inputs.environment }}"
          bundle_root="${RUNNER_TEMP}/bundle"
          mkdir -p "${bundle_root}/envs/${deploy_env}"
          cp compose.yml "${bundle_root}/compose.yml"
          cp "envs/${deploy_env}/compose.yml" "${bundle_root}/envs/${deploy_env}/compose.yml"
          cp "envs/${deploy_env}/.env.minio" "${bundle_root}/envs/${deploy_env}/.env.minio"
          env_minio="${bundle_root}/envs/${deploy_env}/.env.minio"
          env_minio_tmp=$(mktemp "${env_minio}.XXXXXX")
          trap 'rm -f "${env_minio_tmp}"' EXIT
          password_written=false
          while IFS= read -r line || [[ -n "${line}" ]]; do
            if [[ "${line}" == "MINIO_ROOT_PASSWORD="* ]]; then
              printf 'MINIO_ROOT_PASSWORD=%s\n' "${DEPLOY_MINIO_ROOT_PASSWORD}" >> "${env_minio_tmp}"
              password_written=true
            else
              printf '%s\n' "${line}" >> "${env_minio_tmp}"
            fi
          done < "${env_minio}"
          if [[ "${password_written}" != "true" ]]; then
            printf 'MINIO_ROOT_PASSWORD=%s\n' "${DEPLOY_MINIO_ROOT_PASSWORD}" >> "${env_minio_tmp}"
          fi
          mv "${env_minio_tmp}" "${env_minio}"
          trap - EXIT
          env_deploy="${bundle_root}/envs/${deploy_env}/.env.deploy"
          printf 'MAKEPAD_MINIO_CATWLK_OBJECTS_NETWORK=%s\n' "${DEPLOY_CATWLK_OBJECTS_NETWORK}" > "${env_deploy}"
          if [[ "${deploy_env}" == "production" ]]; then
            : "${DEPLOY_VIF_OBJECTS_NETWORK:?set DEPLOY_VIF_OBJECTS_NETWORK production environment secret}"
            : "${DEPLOY_FASHION_OBJECTS_NETWORK:?set DEPLOY_FASHION_OBJECTS_NETWORK production environment secret}"
            printf 'MAKEPAD_MINIO_VIF_OBJECTS_NETWORK=%s\n' "${DEPLOY_VIF_OBJECTS_NETWORK}" >> "${env_deploy}"
            printf 'MAKEPAD_MINIO_FASHION_OBJECTS_NETWORK=%s\n' "${DEPLOY_FASHION_OBJECTS_NETWORK}" >> "${env_deploy}"
          fi
          chmod 600 "${env_minio}" "${env_deploy}"

      - name: Deploy via Docker Swarm
        shell: bash
        env:
          REMOTE_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          REMOTE_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          REMOTE_USER: ${{ secrets.DEPLOY_SSH_USER }}
          REMOTE_DIR: ${{ secrets.DEPLOY_REMOTE_DIR }}
          STACK_NAME: ${{ secrets.DEPLOY_STACK_NAME }}
        run: |
          set -euo pipefail
          : "${REMOTE_HOST:?}" "${REMOTE_USER:?}" "${REMOTE_DIR:?}" "${STACK_NAME:?}"
          if [[ "${REMOTE_USER}" == "root" ]]; then
            echo "DEPLOY_SSH_USER must not be root." >&2
            exit 1
          fi
          bundle_root="${RUNNER_TEMP}/bundle"
          remote_port=${REMOTE_PORT:-22}
          ssh_opts=(-o StrictHostKeyChecking=accept-new -p "${remote_port}")
          scp_opts=(-o StrictHostKeyChecking=accept-new -P "${remote_port}")
          remote_target="${REMOTE_USER}@${REMOTE_HOST}"

          ssh "${ssh_opts[@]}" "${remote_target}" mkdir -p "${REMOTE_DIR}/envs/${{ inputs.environment }}"
          scp "${scp_opts[@]}" "${bundle_root}/compose.yml" "${remote_target}:${REMOTE_DIR}/compose.yml"
          scp "${scp_opts[@]}" "${bundle_root}/envs/${{ inputs.environment }}/compose.yml" "${remote_target}:${REMOTE_DIR}/envs/${{ inputs.environment }}/compose.yml"
          scp "${scp_opts[@]}" "${bundle_root}/envs/${{ inputs.environment }}/.env.minio" "${remote_target}:${REMOTE_DIR}/envs/${{ inputs.environment }}/.env.minio"
          # shellcheck disable=SC2029
          ssh "${ssh_opts[@]}" "${remote_target}" chmod 600 "${REMOTE_DIR}/envs/${{ inputs.environment }}/.env.minio"
          scp "${scp_opts[@]}" "${bundle_root}/envs/${{ inputs.environment }}/.env.deploy" "${remote_target}:${REMOTE_DIR}/envs/${{ inputs.environment }}/.env.deploy"
          # shellcheck disable=SC2029
          ssh "${ssh_opts[@]}" "${remote_target}" chmod 600 "${REMOTE_DIR}/envs/${{ inputs.environment }}/.env.deploy"

          ssh "${ssh_opts[@]}" "${remote_target}" bash -se -- "${REMOTE_DIR}" "${STACK_NAME}" "${{ inputs.environment }}" <<'EOF'
          set -euo pipefail
          remote_dir=$1
          stack_name=$2
          deploy_env=$3
          env_minio="${remote_dir}/envs/${deploy_env}/.env.minio"
          env_deploy="${remote_dir}/envs/${deploy_env}/.env.deploy"
          env_value() {
            local key=$1
            local file=$2
            awk -v key="${key}" '
              index($0, key "=") == 1 {
                value = substr($0, length(key) + 2)
                found = 1
              }
              END {
                if (found) {
                  printf "%s", value
                }
              }
            ' "${file}"
          }
          require_value() {
            local key=$1
            local value=$2
            if [[ -z "${value}" ]]; then
              echo "Missing required deploy value: ${key}" >&2
              exit 1
            fi
          }

          objects_network=$(env_value MAKEPAD_MINIO_CATWLK_OBJECTS_NETWORK "${env_deploy}")
          vif_objects_network=$(env_value MAKEPAD_MINIO_VIF_OBJECTS_NETWORK "${env_deploy}")
          fashion_objects_network=$(env_value MAKEPAD_MINIO_FASHION_OBJECTS_NETWORK "${env_deploy}")
          catwlk_bucket=$(env_value MAKEPAD_MINIO_CATWLK_BUCKET "${env_minio}")
          vif_bucket=$(env_value MAKEPAD_MINIO_VIF_BUCKET "${env_minio}")
          fashion_bucket=$(env_value MAKEPAD_MINIO_FASHION_BUCKET "${env_minio}")
          minio_root_user=$(env_value MINIO_ROOT_USER "${env_minio}")
          minio_root_password=$(env_value MINIO_ROOT_PASSWORD "${env_minio}")

          require_value MAKEPAD_MINIO_CATWLK_OBJECTS_NETWORK "${objects_network}"
          require_value MAKEPAD_MINIO_CATWLK_BUCKET "${catwlk_bucket}"
          require_value MINIO_ROOT_USER "${minio_root_user}"
          require_value MINIO_ROOT_PASSWORD "${minio_root_password}"

          vif_enabled=false
          fashion_enabled=false
          if [[ "${deploy_env}" == "production" || -n "${vif_objects_network}" || -n "${vif_bucket}" ]]; then
            vif_enabled=true
            require_value MAKEPAD_MINIO_VIF_OBJECTS_NETWORK "${vif_objects_network}"
            require_value MAKEPAD_MINIO_VIF_BUCKET "${vif_bucket}"
          fi
          if [[ "${deploy_env}" == "production" || -n "${fashion_objects_network}" || -n "${fashion_bucket}" ]]; then
            fashion_enabled=true
            require_value MAKEPAD_MINIO_FASHION_OBJECTS_NETWORK "${fashion_objects_network}"
            require_value MAKEPAD_MINIO_FASHION_BUCKET "${fashion_bucket}"
          fi

          docker network inspect "${objects_network}" >/dev/null 2>&1 \
            || docker network create --driver overlay --attachable "${objects_network}"
          if [[ "${vif_enabled}" == "true" ]]; then
            docker network inspect "${vif_objects_network}" >/dev/null 2>&1 \
              || docker network create --driver overlay --attachable "${vif_objects_network}"
          fi
          if [[ "${fashion_enabled}" == "true" ]]; then
            docker network inspect "${fashion_objects_network}" >/dev/null 2>&1 \
              || docker network create --driver overlay --attachable "${fashion_objects_network}"
          fi

          compose_env=("MAKEPAD_MINIO_CATWLK_OBJECTS_NETWORK=${objects_network}")
          if [[ "${vif_enabled}" == "true" ]]; then
            compose_env+=("MAKEPAD_MINIO_VIF_OBJECTS_NETWORK=${vif_objects_network}")
          fi
          if [[ "${fashion_enabled}" == "true" ]]; then
            compose_env+=("MAKEPAD_MINIO_FASHION_OBJECTS_NETWORK=${fashion_objects_network}")
          fi

          umask 077
          stack_tmp=$(mktemp "${remote_dir}/stack.yml.XXXXXX")
          trap 'rm -f "${stack_tmp}"' EXIT
          env "${compose_env[@]}" docker compose \
            --env-file "${env_minio}" \
            --env-file "${env_deploy}" \
            -f "${remote_dir}/compose.yml" \
            -f "${remote_dir}/envs/${deploy_env}/compose.yml" \
            config > "${stack_tmp}"
          chmod 600 "${stack_tmp}"
          mv "${stack_tmp}" "${remote_dir}/stack.yml"
          chmod 600 "${remote_dir}/stack.yml"
          trap - EXIT

          docker stack deploy --compose-file "${remote_dir}/stack.yml" "${stack_name}"

          for attempt in $(seq 1 30); do
            if docker run --rm --network "${objects_network}" minio/mc:latest \
              alias set local http://makepad-minio:9000 "${minio_root_user}" "${minio_root_password}" >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

          docker run --rm --network "${objects_network}" minio/mc:latest \
            alias set local http://makepad-minio:9000 "${minio_root_user}" "${minio_root_password}" >/dev/null
          docker run --rm --network "${objects_network}" minio/mc:latest \
            mb --ignore-existing "local/${catwlk_bucket}" >/dev/null
          if [[ "${vif_enabled}" == "true" ]]; then
            for attempt in $(seq 1 30); do
              if docker run --rm --network "${vif_objects_network}" minio/mc:latest \
                alias set local http://makepad-minio-vif:9000 "${minio_root_user}" "${minio_root_password}" >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done

            docker run --rm --network "${vif_objects_network}" minio/mc:latest \
              alias set local http://makepad-minio-vif:9000 "${minio_root_user}" "${minio_root_password}" >/dev/null
            docker run --rm --network "${vif_objects_network}" minio/mc:latest \
              mb --ignore-existing "local/${vif_bucket}" >/dev/null
          fi
          if [[ "${fashion_enabled}" == "true" ]]; then
            for attempt in $(seq 1 30); do
              if docker run --rm --network "${fashion_objects_network}" minio/mc:latest \
                alias set local http://makepad-minio-fashion:9000 "${minio_root_user}" "${minio_root_password}" >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done

            docker run --rm --network "${fashion_objects_network}" minio/mc:latest \
              alias set local http://makepad-minio-fashion:9000 "${minio_root_user}" "${minio_root_password}" >/dev/null
            docker run --rm --network "${fashion_objects_network}" minio/mc:latest \
              mb --ignore-existing "local/${fashion_bucket}" >/dev/null
          fi
          EOF
