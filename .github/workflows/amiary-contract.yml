name: Amiary MinIO Contract

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/amiary-contract.yml"
      - "README.md"
      - "compose.yml"
      - "config/**"
      - "envs/**"
      - "policies/**"
      - "scripts/**"
      - "systemd/**"

concurrency:
  group: amiary-minio-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  contract:
    name: Amiary provisioning and backup contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Pull pinned private MinIO fixture
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
        shell: bash
        run: |
          set -euo pipefail
          registry=$(mktemp -d "$RUNNER_TEMP/minio-registry.XXXXXX")
          trap 'rm -rf -- "$registry"' EXIT
          printf '%s' "$GH_TOKEN" | docker --config "$registry" login ghcr.io -u "$GH_ACTOR" --password-stdin >/dev/null
          docker --config "$registry" pull ghcr.io/makepad-fr/visitaki-test-minio@sha256:f6efb212cad3b62f78ca02339f16d8bc28d5bb2fbe792dfc21225c6037d2af8b
      - name: ShellCheck
        timeout-minutes: 2
        run: shellcheck scripts/*.sh

      - name: Static backup contract
        timeout-minutes: 2
        run: timeout 90s bash scripts/test-amiary-backup-static.sh

      - name: Disposable provisioning contract
        timeout-minutes: 5
        run: timeout 4m bash scripts/test-amiary-provisioning.sh

      - name: Disposable backup and restore contract
        timeout-minutes: 10
        run: timeout 8m bash scripts/test-amiary-backup-disposable.sh
